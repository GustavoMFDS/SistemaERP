groups:
  - name: sistemaemgo-api
    rules:
      - alert: SistemaEmGoMetricsUnavailable
        expr: up{job="sistemaemgo-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: SistemaEmGo metrics endpoint is unavailable
          description: Prometheus has been unable to scrape the API for more than 2 minutes.

      - alert: SistemaEmGoReadinessFailed
        expr: probe_success{job="sistemaemgo-readiness"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: SistemaEmGo readiness probe is failing
          description: /health/ready has failed continuously for more than 1 minute. Check PostgreSQL and Redis first.

      - alert: SistemaEmGoHighHTTP5xxRate
        expr: |
          (
            sum(rate(sistemaemgo_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(sistemaemgo_http_requests_total[5m])), 0.001)
          ) > 0.02
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: SistemaEmGo HTTP 5xx rate is elevated
          description: More than 2% of HTTP requests have returned 5xx for 10 minutes.

      - alert: SistemaEmGoHighHTTPLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(sistemaemgo_http_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: SistemaEmGo p95 HTTP latency is elevated
          description: p95 request latency has exceeded 1 second for 10 minutes.
