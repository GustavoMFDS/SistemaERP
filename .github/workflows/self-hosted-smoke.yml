name: Self-hosted runner smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    name: self-hosted-smoke-${{ matrix.slot }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Runner identity
        shell: powershell
        run: |
          Write-Host "runner.name=${{ runner.name }}"
          Write-Host "runner.os=${{ runner.os }}"
          Write-Host "runner.arch=${{ runner.arch }}"
          Write-Host "machine=$env:COMPUTERNAME"
          Write-Host "workspace=$env:GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify Git
        shell: powershell
        run: git --version

      - name: Verify Docker
        shell: powershell
        run: |
          Get-Command docker -ErrorAction Stop | Format-List
          docker version
          docker compose version

      - name: Verify GitHub connectivity
        shell: powershell
        run: |
          $response = Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com' -Method Head -TimeoutSec 15
          if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 400) {
            throw "GitHub connectivity check failed with status $($response.StatusCode)"
          }

      - name: Verify Docker Linux containers
        shell: powershell
        run: docker run --rm alpine:3.20 uname -a
