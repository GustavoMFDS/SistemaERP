name: Esterium Windows Setup EXE
on:
  workflow_dispatch:
    inputs:
      run_experimental_edb_install:
        description: 'Run known-flaky real EDB unattended installer experiment (disposable CI only)'
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - 'windows-setup/**'
      - '.github/workflows/esterium-windows-setup.yml'
  push:
    branches: [main]
    paths:
      - 'windows-setup/**'
      - '.github/workflows/esterium-windows-setup.yml'

permissions:
  contents: read

jobs:
  unsigned-preview:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build UI executable (no payload, no release)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\windows-setup\build-esterium-setup-exe.ps1 -OutputDir "$env:GITHUB_WORKSPACE\release-preview"
          $exe = "$env:GITHUB_WORKSPACE\release-preview\EsteriumERP-Setup.exe"
          if (-not (Test-Path $exe)) { throw 'Missing Setup EXE' }
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\release-preview\LICENSE.txt") -or
              -not (Test-Path "$env:GITHUB_WORKSPACE\release-preview\THIRD_PARTY_NOTICES.md")) {
            throw 'Unsigned MIT preview must ship its copyright and vendor notices'
          }
          $test = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw 'Bootstrap self-test failed' }
          $payload = Start-Process -FilePath $exe -ArgumentList '--has-payload' -Wait -PassThru
          if ($payload.ExitCode -ne 2) { throw 'Unsigned preview must NOT have embedded payload' }
          $pins = Start-Process -FilePath $exe -ArgumentList '--has-preview-approvals' -Wait -PassThru
          if ($pins.ExitCode -ne 2) { throw 'Empty preview must not advertise approved vendor digests' }
          $retail = Start-Process -FilePath $exe -ArgumentList '--is-retail-build' -Wait -PassThru
          if ($retail.ExitCode -ne 3) { throw 'Unsigned preview must permanently block installation' }
          $fresh = Start-Process -FilePath $exe -ArgumentList '--preflight-oss' -Wait -PassThru
          if ($fresh.ExitCode -ne 5) {throw 'Empty preview must not claim Windows installation readiness'}
          if ((Get-AuthenticodeSignature $exe).Status -eq 'Valid') {
            throw 'Preview unexpectedly signed; do not publish as commercial release'
          }
      - name: Reject incomplete packaging inputs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $rejected = $false
          try {
            & .\windows-setup\build-esterium-setup-exe.ps1 -OutputDir "$env:RUNNER_TEMP\must-not-exist" -ExpectedPostgresSHA256 ('A' * 64)
          } catch { $rejected = $true }
          if (-not $rejected) { throw 'Builder accepted incomplete vendor input' }
          if (Test-Path "$env:RUNNER_TEMP\must-not-exist") { throw 'Rejected build created output' }
      - name: Inspect synthetic embedded ZIP; reject tampered hash
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'esterium-synthetic-embed'
          foreach ($name in @('erp\web','erp\tools','vendor')) {
            New-Item -ItemType Directory -Path (Join-Path $dir ('payload\'+$name)) -Force | Out-Null
          }
          $files = @('erp\bundle-manifest.json','erp\esterium-server.exe','erp\web\index.html',
                     'erp\tools\install-esterium-local-complete.ps1',
                     'vendor\postgresql.exe','vendor\garnet.zip','vendor\nssm.exe')
          foreach ($file in $files) {
            Set-Content -LiteralPath (Join-Path (Join-Path $dir 'payload') $file) -Value "SYNTHETIC CI ONLY $file" -Encoding Ascii
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Join-Path $dir 'payload.zip'
          [IO.Compression.ZipFile]::CreateFromDirectory((Join-Path $dir 'payload'),$zip)
          $exe = Join-Path $dir 'test-preview.exe'
          $approvalFile = Join-Path $dir 'preview-approvals.json'
          '{"manifest":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA","pgSigner":"BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB"}' | Set-Content -LiteralPath $approvalFile -Encoding UTF8
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64/v4.0.30319/csc.exe'
          & $csc /nologo /target:winexe /platform:x64 /define:ESTERIUM_PREVIEW /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.IO.Compression.dll /r:System.Web.Extensions.dll /r:System.ServiceProcess.dll /r:System.Management.dll ("/out:" + $exe) ("/resource:" + $zip + ",Esterium.Payload") ("/resource:" + $approvalFile + ",Esterium.PreviewApprovals") .\windows-setup\EsteriumSetup.cs .\windows-setup\EsteriumOpenSourceStage.cs .\windows-setup\EsteriumOpenSourceVendors.cs .\windows-setup\EsteriumOpenSourcePreflight.cs .\windows-setup\EsteriumPostgresZipMode.cs
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic resource build failed' }
          $probe = Start-Process -FilePath $exe -ArgumentList '--is-retail-build' -Wait -PassThru
          if ($probe.ExitCode -ne 3) { throw 'Synthetic preview unexpectedly installable' }
          # Synthetic untrusted ZIP must be refused before touching Program Files.
          $stage = Start-Process -FilePath $exe -ArgumentList '--stage-oss-files' -Wait -PassThru
          if ($stage.ExitCode -ne 5) { throw 'Synthetic untrusted payload was accepted for staging' }
          $vendorStage = Start-Process -FilePath $exe -ArgumentList '--stage-oss-vendors' -Wait -PassThru
          if ($vendorStage.ExitCode -ne 5) { throw 'Synthetic untrusted vendor payload was accepted' }
          $fresh = Start-Process -FilePath $exe -ArgumentList '--preflight-oss' -Wait -PassThru
          if ($fresh.ExitCode -ne 5) { throw 'Synthetic untrusted payload was accepted by fresh-host preflight' }
          $meta = Start-Process -FilePath $exe -ArgumentList '--has-preview-approvals' -Wait -PassThru
          if ($meta.ExitCode -ne 0) { throw 'Preview approval metadata was not embedded' }
          $manifest = [Reflection.Assembly]::LoadFrom($exe).GetManifestResourceStream('Esterium.PreviewApprovals')
          if ($null -eq $manifest) { throw 'Preview approval resource missing' }
          $manifest.Dispose()
          $checks = @{Exe=$exe;
            ExpectedManifestSHA256=(Get-FileHash (Join-Path $dir 'payload\erp\bundle-manifest.json') -Algorithm SHA256).Hash;
            ExpectedPostgresSHA256=(Get-FileHash (Join-Path $dir 'payload\vendor\postgresql.exe') -Algorithm SHA256).Hash;
            ExpectedGarnetSHA256=(Get-FileHash (Join-Path $dir 'payload\vendor\garnet.zip') -Algorithm SHA256).Hash;
            ExpectedNssmSHA256=(Get-FileHash (Join-Path $dir 'payload\vendor\nssm.exe') -Algorithm SHA256).Hash}
          & .\windows-setup\test-embedded-preview.ps1 @checks
          $rejected = $false
          $checks.ExpectedGarnetSHA256 = ('A' * 64)
          try {
            & .\windows-setup\test-embedded-preview.ps1 @checks | Out-Null
          } catch { $rejected = $true }
          if (-not $rejected) { throw 'Tampered vendor digest was accepted' }
      - uses: actions/upload-artifact@v4
        with:
          name: Esterium-Windows-Setup-UNSIGNED-TECHNICAL-PREVIEW
          path: release-preview/*
          retention-days: 7

  unsigned-real-readonly-plan:
    # Manual CI only: build ERP, verify vendor origin and stage native files.
    # Final step installs REAL EDB on a unique disposable GitHub runner,
    # and forcibly disables/stops its CI-only service. Never a customer host.
    if: github.event_name == 'workflow_dispatch' && inputs.run_experimental_edb_install == true
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify unsigned staging then install real EDB on disposable Windows ONLY
        shell: powershell
        env:
          ESTERIUM_OPEN_SOURCE_PLAN_DISPOSABLE_CI: "1"
          ESTERIUM_REAL_EDB_DISPOSABLE_CI: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --global npm@11.6.1
          if ($LASTEXITCODE -ne 0) { throw 'npm toolchain unavailable' }
          & .\windows-setup\test-unsigned-real-plan-ci.ps1

  postgresql-oss-binaries-smoke:
    # Preferred integration path: EDB's officially offered binary ZIP for
    # software vendors. Manual CI: verify independently pinned SHA-256,
    # ZIP paths, extracted executable versions. NO installation or services.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Verify official EDB Windows 16.15 binary ZIP, no installation
        shell: powershell
        env:
          ESTERIUM_PG_ZIP_DISPOSABLE_CI: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          & .\windows-setup\test-postgres-oss-binaries-ci.ps1

  unsigned-integrated-zip-preview:
    # Build a real complete one-file MIT preview containing the official
    # PostgreSQL 16.15 binaries ZIP, ERP, Garnet and NSSM. It only stages,
    # validates and preflights on ephemeral GitHub Windows; never installs.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Integrated one-file ZIP preview, pin hashes, stage safely (never Apply)
        shell: powershell
        env:
          ESTERIUM_OPEN_SOURCE_PLAN_DISPOSABLE_CI: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --global npm@11.6.1
          if ($LASTEXITCODE -ne 0) { throw 'npm tooling unavailable' }
          & .\windows-setup\test-unsigned-real-plan-ci.ps1 -PostgresBinaryZip
