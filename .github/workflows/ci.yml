name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      - name: Verify Go module files
        run: |
          go mod tidy
          git diff --quiet -- go.mod go.sum
      - name: gofmt check
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            gofmt -d .
            exit 1
          fi
      - name: Validate pilot readiness script
        run: |
          bash -n ../scripts/pilot-readiness.sh
          grep -q 'require_env PILOT_TENANT_ID' ../scripts/pilot-readiness.sh
          grep -q "p.code='sale:write'" ../scripts/pilot-readiness.sh
          grep -q "p.code IN ('finance:read','audit:read')" ../scripts/pilot-readiness.sh
      - run: go test ./...
      - run: go vet ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      - name: Start dependencies and run clean migrations
        run: docker compose up -d db redis migrate
      - name: Verify migration container
        run: docker compose ps --all
      - name: Seed integration data
        run: docker compose run --rm seed
      - name: Verify v12 to v22 migration upgrade and rollback
        run: |
          docker compose exec -T db psql -U sistemaemgo -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS sistemaemgo_upgrade WITH (FORCE);" \
            -c "CREATE DATABASE sistemaemgo_upgrade OWNER sistemaemgo;"

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            goto 12

          docker compose run --rm -v "$PWD/backend/seed:/seed:ro" db \
            psql "postgres://sistemaemgo:sistemaemgo@db:5432/sistemaemgo_upgrade?sslmode=disable" \
            -v ON_ERROR_STOP=1 -v ALLOW_DEMO_SEED=1 -f /seed/seed.sql

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 \
            -c "SELECT indexname FROM pg_indexes WHERE indexname='cash_sessions_one_open_per_register';"

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            down 1

          # Prove that a legacy duplicate-open state is rejected instead of
          # being silently mutated by migration 0013.
          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO cash_registers(tenant_id, name, active)
          SELECT c.id, 'Caixa Upgrade CI', true
          FROM companies c
          ORDER BY c.created_at
          LIMIT 1
          ON CONFLICT (tenant_id, name) DO NOTHING;

          INSERT INTO cash_sessions(
            tenant_id, cash_register_id, opened_by_user_id, opening_amount, status
          )
          SELECT cr.tenant_id, cr.id, u.id, 0, 'open'
          FROM cash_registers cr
          JOIN user_tenants ut ON ut.tenant_id=cr.tenant_id
          JOIN users u ON u.id=ut.user_id
          WHERE cr.name='Caixa Upgrade CI'
          ORDER BY cr.created_at, u.created_at
          LIMIT 1;

          INSERT INTO cash_sessions(
            tenant_id, cash_register_id, opened_by_user_id, opening_amount, status
          )
          SELECT cr.tenant_id, cr.id, u.id, 0, 'open'
          FROM cash_registers cr
          JOIN user_tenants ut ON ut.tenant_id=cr.tenant_id
          JOIN users u ON u.id=ut.user_id
          WHERE cr.name='Caixa Upgrade CI'
          ORDER BY cr.created_at, u.created_at
          LIMIT 1;
          SQL

          if docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1; then
            echo "migration 0013 unexpectedly accepted duplicate open cash sessions"
            exit 1
          fi

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 \
            -c "DELETE FROM cash_sessions WHERE status='open';" \
            -c "UPDATE schema_migrations SET dirty=false WHERE version=13 AND dirty=true;"

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            force 12

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 \
            -c "SELECT column_name FROM information_schema.columns WHERE table_name='cash_sessions' AND column_name IN ('expected_cash','closing_difference') ORDER BY column_name;"

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            down 1

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          # Upgrade 0014 -> 0015, verify cash movement/reconciliation schema,
          # then prove rollback/reapply is clean.
          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 \
            -c "SELECT to_regclass('public.cash_movements'), to_regclass('public.cash_session_reconciliations');" \
            -c "SELECT code FROM permissions WHERE code='cash:move';"

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            down 1

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          # Upgrade 0015 -> 0016, verify retention index, then rollback/reapply.
          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 \
            -c "SELECT indexname FROM pg_indexes WHERE indexname='idempotency_keys_created_at_idx';"

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            down 1

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          # Upgrade 0016 -> 0017, verify tenant-scoped barcode uniqueness,
          # then rollback/reapply.
          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 \
            -c "SELECT indexname FROM pg_indexes WHERE indexname='products_tenant_barcode_unique';"

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 <<'SQL'
          WITH new_tenant AS (
            INSERT INTO companies(legal_name, trade_name, cnpj)
            VALUES ('Barcode CI Tenant', 'Barcode CI Tenant', '99999999999990')
            RETURNING id
          )
          INSERT INTO products(tenant_id, sku, barcode, name, unit, price_cash)
          SELECT id, 'CI-CROSS-TENANT-BARCODE', '7890000000000', 'Cross tenant barcode product', 'UN', 1
          FROM new_tenant;
          SQL

          if docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 \
            -c "INSERT INTO products(tenant_id, sku, barcode, name, unit, price_cash) SELECT tenant_id, 'CI-DUPLICATE-BARCODE', barcode, 'Duplicate barcode product', 'UN', 1 FROM products WHERE barcode='7890000000000' ORDER BY created_at LIMIT 1;"; then
            echo "migration 0017 unexpectedly accepted a duplicate barcode inside one tenant"
            exit 1
          fi

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 \
            -c "DELETE FROM products WHERE sku='CI-CROSS-TENANT-BARCODE';" \
            -c "DELETE FROM companies WHERE cnpj='99999999999990';"

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            down 1

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 <<'SQL'
          DO $do$
          BEGIN
            IF to_regclass('public.products_tenant_barcode_unique') IS NOT NULL THEN
              RAISE EXCEPTION 'rollback 0017 left tenant barcode index behind';
            END IF;
            IF to_regclass('public.products_barcode_unique') IS NULL THEN
              RAISE EXCEPTION 'rollback 0017 did not restore global barcode uniqueness';
            END IF;
          END $do$;
          SQL

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          # Upgrade 0017 -> 0018, verify procurement schema and immutable
          # idempotency records, then rollback/reapply.
          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 \
            -c "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('suppliers','purchases','purchase_items','purchase_receipts','purchase_receipt_items','procurement_idempotency_keys') ORDER BY table_name;" \
            -c "SELECT column_name FROM information_schema.columns WHERE table_name='accounts_payable' AND column_name IN ('supplier_id','purchase_id') ORDER BY column_name;" \
            -c "SELECT code FROM permissions WHERE code IN ('procurement:read','procurement:write','procurement:receive') ORDER BY code;" \
            -c "SELECT r.name, p.code FROM roles r JOIN role_permissions rp ON rp.role_id=r.id JOIN permissions p ON p.id=rp.permission_id WHERE r.name IN ('admin','manager') AND p.code IN ('procurement:read','procurement:write','procurement:receive') ORDER BY r.name,p.code;" \
            -c "SELECT conname FROM pg_constraint WHERE conname IN ('purchases_supplier_tenant_fk','purchase_items_purchase_tenant_fk','purchase_items_product_tenant_fk','purchase_receipts_purchase_tenant_fk','purchase_receipt_items_receipt_tenant_fk','purchase_receipt_items_purchase_item_tenant_fk','purchase_receipt_items_product_tenant_fk','accounts_payable_supplier_tenant_fk','accounts_payable_purchase_tenant_fk') ORDER BY conname;" \
            -c "SELECT indexname FROM pg_indexes WHERE indexname='procurement_idempotency_created_at_idx';" \
            -c "SELECT tgname FROM pg_trigger WHERE tgrelid='procurement_idempotency_keys'::regclass AND tgname='procurement_idempotency_keys_immutable';"

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            down 1

          PROCUREMENT_PERMISSION_COUNT="$(docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -Atc "SELECT count(*) FROM permissions WHERE code IN ('procurement:read','procurement:write','procurement:receive');" | tr -d '[:space:]')"
          if [ "$PROCUREMENT_PERMISSION_COUNT" != "0" ]; then
            echo "rollback 0018 left procurement permissions behind"
            exit 1
          fi

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 <<'SQL'
          DO $do$
          BEGIN
            IF to_regclass('public.suppliers') IS NOT NULL
               OR to_regclass('public.purchases') IS NOT NULL
               OR to_regclass('public.procurement_idempotency_keys') IS NOT NULL THEN
              RAISE EXCEPTION 'rollback 0018 left procurement tables behind';
            END IF;
            IF EXISTS (
              SELECT 1
              FROM information_schema.columns
              WHERE table_name='accounts_payable'
                AND column_name IN ('supplier_id','purchase_id')
            ) THEN
              RAISE EXCEPTION 'rollback 0018 left procurement payable columns behind';
            END IF;
            IF to_regclass('public.products_tenant_id_id_unique') IS NOT NULL THEN
              RAISE EXCEPTION 'rollback 0018 left products composite support index behind';
            END IF;
          END $do$;
          SQL

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          # Upgrade 0018 -> 0019, verify returns schema, dedicated permission,
          # immutable idempotency and rollback/reapply.
          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 \
            -c "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('sale_returns','sale_return_items','return_idempotency_keys') ORDER BY table_name;" \
            -c "SELECT code FROM permissions WHERE code='sale:return';" \
            -c "SELECT conname FROM pg_constraint WHERE conname IN ('sale_returns_sale_tenant_fk','sale_return_items_return_tenant_fk','sale_return_items_sale_item_tenant_fk','sale_return_items_product_tenant_fk','return_idempotency_return_tenant_fk') ORDER BY conname;" \
            -c "SELECT indexname FROM pg_indexes WHERE indexname='return_idempotency_created_at_idx';" \
            -c "SELECT tgname FROM pg_trigger WHERE tgrelid='return_idempotency_keys'::regclass AND tgname='return_idempotency_keys_immutable';"

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            down 1

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 <<'SQL'
          DO $do$
          BEGIN
            IF EXISTS (SELECT 1 FROM permissions WHERE code='sale:return') THEN
              RAISE EXCEPTION 'rollback 0019 left sale:return permission behind';
            END IF;
            IF to_regclass('public.sale_returns') IS NOT NULL THEN
              RAISE EXCEPTION 'rollback 0019 left sale_returns behind';
            END IF;
          END $do$;
          SQL

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          # Upgrade 0019 -> 0020, verify payment reconciliation/refund schema
          # and the dedicated finance permission, then rollback/reapply.
          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 \
            -c "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('payment_reconciliations','return_refunds','finance_idempotency_keys') ORDER BY table_name;" \
            -c "SELECT indexname FROM pg_indexes WHERE indexname='payment_reconciliations_tenant_payment_unique';" \
            -c "SELECT column_name FROM information_schema.columns WHERE table_name='finance_idempotency_keys' AND column_name='result_amount';" \
            -c "SELECT column_name FROM information_schema.columns WHERE table_name='payments' AND column_name IN ('provider','transaction_ref','authorization_code','installments','reconciliation_status','reconciled_amount','reconciled_fee','reconciled_at') ORDER BY column_name;" \
            -c "SELECT code FROM permissions WHERE code='finance:reconcile';" \
            -c "SELECT conname FROM pg_constraint WHERE conname IN ('payment_reconciliation_payment_tenant_fk','return_refunds_return_tenant_fk','return_refunds_sale_tenant_fk','return_refunds_cash_session_tenant_fk') ORDER BY conname;" \
            -c "SELECT indexname FROM pg_indexes WHERE indexname='finance_idempotency_created_at_idx';" \
            -c "SELECT tgname FROM pg_trigger WHERE tgrelid='finance_idempotency_keys'::regclass AND tgname='finance_idempotency_keys_immutable';"

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            down 1

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 <<'SQL'
          DO $do$
          BEGIN
            IF EXISTS (SELECT 1 FROM permissions WHERE code='finance:reconcile') THEN
              RAISE EXCEPTION 'rollback 0020 left finance:reconcile permission behind';
            END IF;
            IF to_regclass('public.payment_reconciliations') IS NOT NULL
               OR to_regclass('public.return_refunds') IS NOT NULL
               OR to_regclass('public.finance_idempotency_keys') IS NOT NULL THEN
              RAISE EXCEPTION 'rollback 0020 left finance reconciliation tables behind';
            END IF;
            IF EXISTS (
              SELECT 1
              FROM information_schema.columns
              WHERE table_name='payments'
                AND column_name IN (
                  'provider','transaction_ref','authorization_code','installments',
                  'reconciliation_status','reconciled_amount','reconciled_fee',
                  'reconciled_at','reconciled_by_user_id','reconciliation_notes'
                )
            ) THEN
              RAISE EXCEPTION 'rollback 0020 left payment reconciliation columns behind';
            END IF;
            IF to_regclass('public.payments_tenant_id_id_unique') IS NOT NULL
               OR to_regclass('public.cash_sessions_tenant_id_id_unique') IS NOT NULL THEN
              RAISE EXCEPTION 'rollback 0020 left composite support indexes behind';
            END IF;
          END $do$;
          SQL

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          # Upgrade 0020 -> 0021, verify discount permission, then rollback/reapply.
          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 \
            -c "SELECT code FROM permissions WHERE code='sale:discount';" \
            -c "SELECT r.name FROM roles r JOIN role_permissions rp ON rp.role_id=r.id JOIN permissions p ON p.id=rp.permission_id WHERE p.code='sale:discount' AND r.name IN ('admin','manager') ORDER BY r.name;"

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            down 1

          DISCOUNT_PERMISSION_COUNT="$(docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -Atc "SELECT count(*) FROM permissions WHERE code='sale:discount';" | tr -d '[:space:]')"
          if [ "$DISCOUNT_PERMISSION_COUNT" != "0" ]; then
            echo "rollback 0021 left sale:discount permission behind"
            exit 1
          fi

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          # Upgrade 0021 -> 0022, verify reconciliation-adjustment history,
          # then rollback/reapply.
          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 \
            -c "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name='payment_reconciliation_adjustments';" \
            -c "SELECT conname FROM pg_constraint WHERE conname='payment_reconciliation_adjustment_payment_tenant_fk';" \
            -c "SELECT indexname FROM pg_indexes WHERE indexname='payment_reconciliation_adjustments_tenant_payment_created_idx';"

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            down 1

          ADJUSTMENT_TABLE="$(docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -Atc "SELECT to_regclass('public.payment_reconciliation_adjustments') IS NOT NULL;" | tr -d '[:space:]')"
          if [ "$ADJUSTMENT_TABLE" != "f" ]; then
            echo "rollback 0022 left payment_reconciliation_adjustments behind"
            exit 1
          fi

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1
      - name: Run tagged integration tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://sistemaemgo:sistemaemgo@localhost:5433/sistemaemgo?sslmode=disable
          TEST_REDIS_ADDR: localhost:6379
        run: go test -tags=integration ./tests/integration/...
      - name: Start API and verify readiness
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgres://sistemaemgo:sistemaemgo@localhost:5433/sistemaemgo?sslmode=disable
          REDIS_ADDR: localhost:6379
          JWT_SECRET: ci-integration-secret-that-is-over-32-chars
          HTTP_ADDR: :18080
          OTEL_ENABLED: "false"
        run: |
          go build -o /tmp/sistemaemgo-api ./cmd/api
          /tmp/sistemaemgo-api > /tmp/sistemaemgo-api.log 2>&1 &
          echo $! > /tmp/sistemaemgo-api.pid
          for i in {1..30}; do
            if curl --fail --silent http://localhost:18080/health/ready; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/sistemaemgo-api.log
          exit 1

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start database, Redis and migrations
        run: docker compose up -d db redis migrate
      - name: Seed browser test data
        run: |
          docker compose run --rm seed
          docker compose run --rm -v "$PWD/backend/seed:/seed:ro" db \
            psql "postgres://sistemaemgo:sistemaemgo@db:5432/sistemaemgo" \
            -v ON_ERROR_STOP=1 -f /seed/seed.e2e.sql
      - name: Start API and wait for readiness
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgres://sistemaemgo:sistemaemgo@localhost:5433/sistemaemgo?sslmode=disable
          REDIS_ADDR: localhost:6379
          JWT_SECRET: ci-e2e-secret-that-is-longer-than-32-characters
          HTTP_ADDR: :8080
          OTEL_ENABLED: "false"
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173
          RATE_LIMIT_LOGIN_PER_MINUTE: "1000"
          RATE_LIMIT_LOGIN_IDENTIFIER_PER_MINUTE: "1000"
          RATE_LIMIT_LOGIN_IP_IDENTIFIER_PER_MINUTE: "1000"
          RATE_LIMIT_REFRESH_PER_MINUTE: "1000"
          RATE_LIMIT_LOGOUT_PER_MINUTE: "1000"
          RATE_LIMIT_SALES_PER_MINUTE: "1000"
          RATE_LIMIT_FISCAL_PER_MINUTE: "1000"
        run: |
          go build -o /tmp/sistemaemgo-api ./cmd/api
          /tmp/sistemaemgo-api > /tmp/api.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health/ready; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/api.log
          exit 1
      - name: Install frontend and Playwright
        working-directory: web
        run: |
          npm install --global npm@11.6.1
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Start frontend
        working-directory: web
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8080
        run: npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/web.log 2>&1 &
      - name: Run browser E2E
        working-directory: web
        run: npx playwright test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Go vulnerability scan
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Frontend production dependency audit
        working-directory: web
        run: |
          npm install --global npm@11.6.1
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Generate remediated frontend lockfile
        working-directory: web
        run: |
          npm audit fix --package-lock-only || true
          npm audit --json > audit-after-fix.json || true
      - name: Upload remediated frontend lockfile
        uses: actions/upload-artifact@v7
        with:
          name: frontend-audit-fix
          path: |
            web/package.json
            web/package-lock.json
            web/audit-after-fix.json
          if-no-files-found: error


  e2e-prodlike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start verified-TLS PostgreSQL and Redis
        run: |
          mkdir -p /tmp/tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=SistemaEmGo CI CA" \
            -keyout /tmp/tls/ca.key \
            -out /tmp/tls/ca.crt

          openssl req -newkey rsa:2048 -nodes \
            -subj "/CN=127.0.0.1" \
            -keyout /tmp/tls/server.key \
            -out /tmp/tls/server.csr
          printf "subjectAltName=IP:127.0.0.1\nextendedKeyUsage=serverAuth\n" > /tmp/tls/server.ext
          openssl x509 -req -days 1 \
            -in /tmp/tls/server.csr \
            -CA /tmp/tls/ca.crt \
            -CAkey /tmp/tls/ca.key \
            -CAcreateserial \
            -extfile /tmp/tls/server.ext \
            -out /tmp/tls/server.crt

          chmod 600 /tmp/tls/server.key
          chmod 644 /tmp/tls/server.crt /tmp/tls/ca.crt
          sudo chown 999:999 /tmp/tls/server.key /tmp/tls/server.crt /tmp/tls/ca.crt
          sudo cp /tmp/tls/ca.crt /usr/local/share/ca-certificates/sistemaemgo-ci-ca.crt
          sudo update-ca-certificates

          docker run -d --name pg-staging \
            -e POSTGRES_DB=sistemaemgo \
            -e POSTGRES_USER=sistemaemgo \
            -e POSTGRES_PASSWORD=ci-staging-db-password \
            -p 55432:5432 \
            -v /tmp/tls:/tls:ro \
            postgres:16 \
            -c ssl=on \
            -c ssl_cert_file=/tls/server.crt \
            -c ssl_key_file=/tls/server.key

          docker run -d --name redis-staging \
            -p 56379:6379 \
            -v /tmp/tls:/tls:ro \
            redis:7.4-alpine \
            redis-server \
              --port 0 \
              --tls-port 6379 \
              --tls-cert-file /tls/server.crt \
              --tls-key-file /tls/server.key \
              --tls-ca-cert-file /tls/ca.crt \
              --tls-auth-clients no \
              --requirepass ci-staging-redis-password

          for i in {1..30}; do
            if docker exec pg-staging pg_isready -U sistemaemgo -d sistemaemgo >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec pg-staging pg_isready -U sistemaemgo -d sistemaemgo
          docker exec redis-staging redis-cli --tls --cacert /tls/ca.crt -a ci-staging-redis-password ping
      - name: Migrate and seed over PostgreSQL TLS
        run: |
          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            -v /tmp/tls:/tls:ro \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:ci-staging-db-password@127.0.0.1:55432/sistemaemgo?sslmode=verify-full&sslrootcert=/tls/ca.crt" \
            up

          docker run --rm --network host \
            -v "$PWD/backend/seed:/seed:ro" \
            -v /tmp/tls:/tls:ro \
            postgres:16 \
            psql "postgres://sistemaemgo:ci-staging-db-password@127.0.0.1:55432/sistemaemgo?sslmode=verify-full&sslrootcert=/tls/ca.crt" \
            -v ON_ERROR_STOP=1 -v ALLOW_DEMO_SEED=1 -f /seed/seed.sql
      - name: Configure staging hostname
        run: echo "127.0.0.1 staging.example.test" | sudo tee -a /etc/hosts

      - name: Start staging-configured API
        working-directory: backend
        env:
          APP_ENV: staging
          FISCAL_PROVIDER: disabled
          DATABASE_URL: "postgres://sistemaemgo:ci-staging-db-password@127.0.0.1:55432/sistemaemgo?sslmode=verify-full&sslrootcert=/tmp/tls/ca.crt"
          REDIS_URL: "rediss://:ci-staging-redis-password@127.0.0.1:56379/0"
          JWT_SECRET: ci-staging-jwt-secret-longer-than-32-characters
          HTTP_ADDR: :18081
          OTEL_ENABLED: "false"
          CORS_ALLOWED_ORIGINS: https://staging.example.test:8443
          TRUSTED_PROXY_CIDRS: 127.0.0.1/32
          METRICS_BEARER_TOKEN: ci-staging-metrics-token
          RATE_LIMIT_LOGIN_PER_MINUTE: "1000"
          RATE_LIMIT_LOGIN_IDENTIFIER_PER_MINUTE: "1000"
          RATE_LIMIT_LOGIN_IP_IDENTIFIER_PER_MINUTE: "1000"
          RATE_LIMIT_REFRESH_PER_MINUTE: "1000"
          RATE_LIMIT_LOGOUT_PER_MINUTE: "1000"
          RATE_LIMIT_SALES_PER_MINUTE: "1000"
          RATE_LIMIT_FISCAL_PER_MINUTE: "1000"
        run: |
          go build -o /tmp/sistemaemgo-staging-api ./cmd/api
          /tmp/sistemaemgo-staging-api > /tmp/staging-api.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18081/health/ready; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/staging-api.log
          exit 1
      - name: Build frontend and start HTTPS reverse proxy
        working-directory: web
        env:
          VITE_API_BASE_URL: https://staging.example.test:8443
        run: |
          npm install --global npm@11.6.1
          npm ci
          npm run build
          npx playwright install --with-deps chromium

          cat > /tmp/Caddyfile <<'EOF'
          https://staging.example.test:8443 {
            tls internal
            @backend path /api/* /health /health/* /metrics
            handle @backend {
              reverse_proxy 127.0.0.1:18081
            }
            handle {
              root * /srv
              try_files {path} /index.html
              file_server
            }
          }
          EOF

          docker run -d --name caddy-staging --network host \
            -v /tmp/Caddyfile:/etc/caddy/Caddyfile:ro \
            -v "$PWD/dist:/srv:ro" \
            caddy:2.8-alpine

          for i in {1..30}; do
            health="$(curl --noproxy '*' -k --fail --silent https://staging.example.test:8443/health/ready || true)"
            app="$(curl --noproxy '*' -k --fail --silent https://staging.example.test:8443/login || true)"
            if echo "$health" | grep -q '"status":"ready"' && echo "$app" | grep -q 'id="root"'; then
              exit 0
            fi
            sleep 2
          done
          docker logs caddy-staging
          exit 1
      - name: Run staging-like browser E2E
        working-directory: web
        env:
          E2E_PRODLIKE: "1"
          E2E_BASE_URL: https://staging.example.test:8443
          E2E_IGNORE_HTTPS_ERRORS: "1"
        run: npx playwright test e2e/prodlike.spec.ts --project=chromium
