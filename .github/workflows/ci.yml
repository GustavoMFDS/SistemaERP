name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-windows-service-tests:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache-dependency-path: backend/go.sum
      - name: Verify native SCM stop/shutdown cancellation
        working-directory: backend
        run: go test -v -count=1 -timeout=2m ./cmd/api

  local-built-spa-origin-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start disposable PostgreSQL, Redis and migrations
        run: docker compose up -d db redis migrate
      - name: Build final Vite assets for same-origin Go serving
        env:
          VITE_API_BASE_URL: ''
        run: |
          npm install --global npm@11.6.1
          npm ci --prefix web
          npm run build --prefix web
      - name: Install Chromium for compiled-SPA UI verification
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Launch compiled Go server and verify real static/UI/API traffic
        run: bash scripts/ci-local-production-bundle-smoke.sh

  local-windows-config-preflight:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache-dependency-path: backend/go.sum
      - name: Validate production configuration without opening external services
        shell: pwsh
        run: ./scripts/test-local-config-preflight-ci.ps1

  local-windows-secret-provision:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Test protected credential generation and service ACLs
        shell: pwsh
        run: ./scripts/test-provision-esterium-app-secrets.ps1

  local-windows-real-scm-smoke:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Register, inspect and remove test-only Windows SCM service
        shell: pwsh
        env:
          ESTERIUM_SCM_DISPOSABLE_CI: "1"
        run: ./scripts/test-register-esterium-real-scm-ci.ps1

  local-windows-installer-plan:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate non-destructive service installer plan
        shell: pwsh
        run: ./scripts/test-register-esterium-windows-service.ps1
      - name: Check synthetic CMS tamper and strict rejection of untrusted signing
        shell: pwsh
        timeout-minutes: 15
        run: ./scripts/test-esterium-signed-release-positive-ci.ps1

  local-backup-integrity-gate:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Verify freshness and integrity of synthetic local and external backups
        shell: pwsh
        run: ./scripts/test-esterium-backup-integrity.ps1
      - name: Verify loopback-only installed dependency inventory using Windows synthetic data
        shell: pwsh
        run: ./scripts/test-esterium-local-dependencies.ps1
      - name: Verify independently approved offline database and cache installer packages (synthetic)
        shell: pwsh
        run: ./scripts/test-esterium-offline-dependency-packages.ps1
      - name: Create synthetic protected Windows Garnet ACL/TLS/Lua configuration
        shell: pwsh
        run: ./scripts/test-esterium-garnet-config.ps1
      - name: Create synthetic protected PostgreSQL offline unattended installer options
        shell: pwsh
        run: ./scripts/test-esterium-postgres-optionfile.ps1
      - name: Prepare combined PostgreSQL and Garnet new-install configuration in disposable Windows CI
        shell: pwsh
        run: ./scripts/test-esterium-local-dependency-configs.ps1
      - name: Audit dry-run of offline PostgreSQL and Garnet installation (never run third-party binaries)
        shell: pwsh
        run: ./scripts/test-esterium-unattended-dependencies.ps1
      - name: Validate static local-only TLS/SCRAM PostgreSQL config using fake Windows files
        shell: pwsh
        run: ./scripts/test-esterium-postgres-tls-policy.ps1
      - name: Validate immutable migration chain and verified backup before Windows upgrade
        shell: pwsh
        run: ./scripts/test-esterium-upgrade-plan.ps1
      - name: Validate protected daily backup scheduling without touching production
        shell: pwsh
        run: ./scripts/test-esterium-backup-task.ps1

  local-external-backup-tests:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Verify external backup copies, checksum and overwrite protection
        shell: pwsh
        run: |
          ./scripts/test-verified-external-backup.ps1

  local-windows-migrator-cli-smoke:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache-dependency-path: backend/go.sum
      - name: Execute the pinned Windows PostgreSQL migrator without a database
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $originalGOBIN = $env:GOBIN
          $out = Join-Path $env:RUNNER_TEMP ('esterium-migrator-cli-' + [Guid]::NewGuid().ToString('N'))
          try {
            [IO.Directory]::CreateDirectory($out) | Out-Null
            $env:GOBIN = $out
            go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.17.1
            if ($LASTEXITCODE -ne 0) { throw 'Go failed to build the Windows migrator.' }
            $binary = Join-Path $out 'migrate.exe'
            if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw 'Windows migration tool missing.' }
            $helpText = (& $binary -help 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0 -or $helpText -notmatch '-database' -or $helpText -notmatch 'Commands') {
              throw 'Pinned Windows migrator did not execute or expose expected CLI commands.'
            }
            Write-Output 'PASS: pinned Windows migrator executes without any database connection.'
          } finally {
            $env:GOBIN = $originalGOBIN
            if (Test-Path -LiteralPath $out) { Remove-Item -LiteralPath $out -Recurse -Force }
          }

  local-windows-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@11.6.1
      - name: Build frontend for same-origin distribution
        env:
          VITE_API_BASE_URL: ''
        run: |
          npm ci --prefix web
          npm run build --prefix web
      - name: Cross-compile and assemble Windows x64 test bundle
        run: |
          set -euo pipefail
          mkdir -p dist/esterium-local-win-x64
          (
            cd backend
            GOOS=windows GOARCH=amd64 go build -trimpath \
              -o ../dist/esterium-local-win-x64/esterium-server.exe ./cmd/api
          )
          cp -R web/dist dist/esterium-local-win-x64/web
          test -s dist/esterium-local-win-x64/esterium-server.exe
          test -s dist/esterium-local-win-x64/web/index.html
      - name: Build pinned PostgreSQL migration tool (Windows x64)
        run: |
          set -euo pipefail
          build_dir="$(mktemp -d)"
          # Go module cache source files are intentionally read-only; do not
          # create/tear down that cache inside the temporary cross-build path.
          shared_module_cache="$(go env GOMODCACHE)"
          trap 'chmod -R u+w "$build_dir" 2>/dev/null || true; rm -rf "$build_dir"' EXIT
          # Go refuses cross-compilation with GOBIN; use an isolated GOPATH and
          # the official bin/windows_amd64 output layout instead.
          (cd backend && GOOS=windows GOARCH=amd64 GOPATH="$build_dir" GOMODCACHE="$shared_module_cache" GOBIN= go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.17.1)
          test -s "$build_dir/bin/windows_amd64/migrate.exe"
          mkdir -p dist/esterium-local-win-x64/tools
          cp "$build_dir/bin/windows_amd64/migrate.exe" dist/esterium-local-win-x64/tools/esterium-migrate.exe
      - name: Add curated Windows setup and backup tools
        run: |
          set -euo pipefail
          mkdir -p dist/esterium-local-win-x64/tools
          cp scripts/register-esterium-windows-service.ps1 \
            scripts/provision-esterium-app-secrets.ps1 \
            scripts/verify-esterium-bundle.ps1 \
            scripts/postgres-daily-backup.ps1 \
            scripts/copy-verified-external-backup.ps1 \
            scripts/check-esterium-backup-integrity.ps1 \
            scripts/run-esterium-scheduled-backup.ps1 \
            scripts/register-esterium-backup-task.ps1 \
            scripts/check-esterium-windows-host.ps1 \
            scripts/unregister-esterium-windows-service.ps1 \
            scripts/check-esterium-local-dependencies.ps1 \
            scripts/plan-esterium-windows-upgrade.ps1 \
            scripts/plan-esterium-local-setup.ps1 \
            scripts/install-esterium-local.ps1 \
            scripts/apply-esterium-app-update.ps1 \
            scripts/check-esterium-signed-release.ps1 \
            scripts/check-esterium-offline-dependency-packages.ps1 \
            scripts/provision-esterium-garnet-config.ps1 \
            scripts/provision-esterium-postgres-optionfile.ps1 \
            scripts/prepare-esterium-local-dependency-configs.ps1 \
            scripts/install-esterium-local-dependencies.ps1 \
            scripts/check-esterium-postgres-tls-policy.ps1 \
            dist/esterium-local-win-x64/tools/
          cp docs/esterium-local-service-registration.md \
            dist/esterium-local-win-x64/README_LOCAL.md
          cp -R backend/migrations dist/esterium-local-win-x64/migrations
          test "$(find dist/esterium-local-win-x64/migrations -name '*.up.sql' | wc -l)" -ge 51
      - name: Generate and verify bundle SHA-256 manifest
        shell: pwsh
        run: |
          ./scripts/write-esterium-bundle-manifest.ps1 -BundleDir 'dist/esterium-local-win-x64'
          ./scripts/verify-esterium-bundle.ps1 -BundleDir 'dist/esterium-local-win-x64'
      - name: Attach unsigned technical Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: esterium-local-l0-win-x64
          path: dist/esterium-local-win-x64/
          if-no-files-found: error
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache-dependency-path: backend/go.sum
      - name: Verify Go module files
        run: |
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            echo "go mod tidy changed module files:"
            git --no-pager diff -- go.mod go.sum
            exit 1
          fi
      - name: gofmt check
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            gofmt -d .
            exit 1
          fi
      - name: Validate operations scripts
        run: |
          bash -n ../scripts/pilot-readiness.sh
          grep -q 'require_env PILOT_TENANT_ID' ../scripts/pilot-readiness.sh
          grep -q "p.code='sale:write'" ../scripts/pilot-readiness.sh
          grep -q "p.code IN ('finance:read','audit:read')" ../scripts/pilot-readiness.sh
          grep -q 'rolsuper, rolcreatedb, rolcreaterole, rolreplication, rolbypassrls' ../scripts/pilot-readiness.sh
          grep -q "has_schema_privilege(current_user, 'public', 'CREATE')" ../scripts/pilot-readiness.sh

          bash -n ../scripts/postgres-backup-drill.sh
          grep -q 'require_env SOURCE_DATABASE_URL' ../scripts/postgres-backup-drill.sh
          grep -q 'require_env RESTORE_DATABASE_URL' ../scripts/postgres-backup-drill.sh
          grep -q 'ALLOW_RESTORE_RESET' ../scripts/postgres-backup-drill.sh
          grep -q 'source and restore connections resolve to the same database' ../scripts/postgres-backup-drill.sh

          bash -n ../scripts/dependency-failure-drill.sh
          grep -q 'ALLOW_DEPENDENCY_FAILURE_DRILL' ../scripts/dependency-failure-drill.sh
          grep -q 'ALLOW_REMOTE_DOCKER_CONTEXT' ../scripts/dependency-failure-drill.sh

      - name: Validate observability configuration
        run: |
          docker compose -f ../docker-compose.observability.yml config >/dev/null
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$GITHUB_WORKSPACE/ops/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$GITHUB_WORKSPACE/ops/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 \
            check rules /etc/prometheus/alerts.yml
      - run: go test ./...
      - run: go vet ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache-dependency-path: backend/go.sum
      - name: Start dependencies and run clean migrations
        run: docker compose up -d db redis migrate
      - name: Verify production Redis security primitives
        working-directory: backend
        env:
          TEST_REDIS_ADDR: localhost:6379
        run: go test -v -count=1 -run '^TestRedisSecurityProbe' ./internal/app
      - name: Verify migration container
        run: docker compose ps --all
      - name: Seed integration data
        run: docker compose run --rm seed
      - name: Prove complete PostgreSQL restore in a second disposable CI database
        run: bash scripts/ci-postgres-disposable-restore.sh
      - name: Prove archive restores on a separate isolated PostgreSQL server
        run: bash scripts/ci-postgres-cross-instance-restore.sh
      - name: Verify v12 to v32 migration upgrade and rollback
        run: |
          docker compose exec -T db psql -U sistemaemgo -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS sistemaemgo_upgrade WITH (FORCE);" \
            -c "CREATE DATABASE sistemaemgo_upgrade OWNER sistemaemgo;"

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            goto 12

          docker compose run --rm -v "$PWD/backend/seed:/seed:ro" db \
            psql "postgres://sistemaemgo:sistemaemgo@db:5432/sistemaemgo_upgrade?sslmode=disable" \
            -v ON_ERROR_STOP=1 -v ALLOW_DEMO_SEED=1 -f /seed/seed.sql

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 \
            -c "SELECT indexname FROM pg_indexes WHERE indexname='cash_sessions_one_open_per_register';"

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            down 1

          # Prove that a legacy duplicate-open state is rejected instead of
          # being silently mutated by migration 0013.
          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 <<'SQL'
          DO $do$
          DECLARE
            v_tenant uuid;
            v_user uuid;
            v_register uuid;
          BEGIN
            SELECT ut.tenant_id, ut.user_id
              INTO v_tenant, v_user
            FROM user_tenants ut
            ORDER BY ut.created_at, ut.user_id
            LIMIT 1;

            IF v_tenant IS NULL OR v_user IS NULL THEN
              RAISE EXCEPTION 'seed must provide a tenant/user relation for migration 0013 test';
            END IF;

            INSERT INTO cash_registers(tenant_id, name, active)
            VALUES (v_tenant, 'Caixa Upgrade CI ' || gen_random_uuid()::text, true)
            RETURNING id INTO v_register;

            INSERT INTO cash_sessions(
              tenant_id, cash_register_id, opened_by_user_id, opening_amount, status
            )
            VALUES
              (v_tenant, v_register, v_user, 0, 'open'),
              (v_tenant, v_register, v_user, 0, 'open');

            IF (
              SELECT count(*)
              FROM cash_sessions
              WHERE tenant_id=v_tenant
                AND cash_register_id=v_register
                AND status='open'
            ) <> 2 THEN
              RAISE EXCEPTION 'failed to create deterministic duplicate-open fixture for migration 0013';
            END IF;
          END
          $do$;
          SQL

          if docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1; then
            echo "migration 0013 unexpectedly accepted duplicate open cash sessions"
            exit 1
          fi

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 \
            -c "DELETE FROM cash_sessions WHERE status='open';" \
            -c "UPDATE schema_migrations SET dirty=false WHERE version=13 AND dirty=true;"

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            force 12

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 \
            -c "SELECT column_name FROM information_schema.columns WHERE table_name='cash_sessions' AND column_name IN ('expected_cash','closing_difference') ORDER BY column_name;"

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            down 1

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          # Upgrade 0014 -> 0015, verify cash movement/reconciliation schema,
          # then prove rollback/reapply is clean.
          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 \
            -c "SELECT to_regclass('public.cash_movements'), to_regclass('public.cash_session_reconciliations');" \
            -c "SELECT code FROM permissions WHERE code='cash:move';"

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            down 1

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          # Upgrade 0015 -> 0016, verify retention index, then rollback/reapply.
          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 \
            -c "SELECT indexname FROM pg_indexes WHERE indexname='idempotency_keys_created_at_idx';"

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            down 1

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          # Upgrade 0016 -> 0017, verify tenant-scoped barcode uniqueness,
          # then rollback/reapply.
          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 \
            -c "SELECT indexname FROM pg_indexes WHERE indexname='products_tenant_barcode_unique';"

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 <<'SQL'
          WITH new_tenant AS (
            INSERT INTO companies(legal_name, trade_name, cnpj)
            VALUES ('Barcode CI Tenant', 'Barcode CI Tenant', '99999999999990')
            RETURNING id
          )
          INSERT INTO products(tenant_id, sku, barcode, name, unit, price_cash)
          SELECT id, 'CI-CROSS-TENANT-BARCODE', '7890000000000', 'Cross tenant barcode product', 'UN', 1
          FROM new_tenant;
          SQL

          if docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 \
