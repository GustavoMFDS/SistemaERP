name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      - name: gofmt check
        run: |
          test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: go vet ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@11.6.1
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start dependencies and run clean migrations
        run: docker compose up -d db redis migrate
      - name: Verify migration container
        run: docker compose ps --all
      - name: Start API and verify readiness
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgres://sistemaemgo:sistemaemgo@localhost:5433/sistemaemgo?sslmode=disable
          REDIS_ADDR: localhost:6379
          JWT_SECRET: ci-integration-secret-that-is-over-32-chars
          HTTP_ADDR: :18080
          OTEL_ENABLED: "false"
        run: |
          go run ./cmd/api > /tmp/sistemaemgo-api.log 2>&1 &
          echo $! > /tmp/sistemaemgo-api.pid
          for i in {1..30}; do
            if curl --fail --silent http://localhost:18080/health/ready; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/sistemaemgo-api.log
          exit 1

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start database, Redis and migrations
        run: docker compose up -d db redis migrate
      - name: Seed browser test data
        run: docker compose run --rm seed
      - name: Start API
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgres://sistemaemgo:sistemaemgo@localhost:5433/sistemaemgo?sslmode=disable
          REDIS_ADDR: localhost:6379
          JWT_SECRET: ci-e2e-secret-that-is-longer-than-32-characters
          HTTP_ADDR: :8080
          OTEL_ENABLED: "false"
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173
        run: go run ./cmd/api > /tmp/api.log 2>&1 &
      - name: Install frontend and Playwright
        working-directory: web
        run: |
          npm install --global npm@11.6.1
          npm ci
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start frontend
        working-directory: web
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8080
        run: npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/web.log 2>&1 &
      - name: Run browser E2E
        working-directory: web
        run: npx playwright test
