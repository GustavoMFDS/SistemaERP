            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            down 1

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 \
            -c "DO \$\$ BEGIN IF to_regclass('public.product_images') IS NOT NULL THEN RAISE EXCEPTION 'rollback v36 left product_images'; END IF; END \$\$;"

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

      - name: Verify captions migration v37 upgrade, rollback and reapply
        run: |
          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 \
            -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='product_images' AND column_name='caption') THEN RAISE EXCEPTION 'v37 caption missing'; END IF; END \$\$;"

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            down 1

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -v ON_ERROR_STOP=1 \
            -c "DO \$\$ BEGIN IF EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name='product_images' AND column_name='caption') THEN RAISE EXCEPTION 'v37 caption rollback failed'; END IF; END \$\$;"

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

      - name: Verify variants migration v38 upgrade, rollback and reapply
        run: |
          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

          VARIANT_TABLE="$(docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -Atc "SELECT to_regclass('public.product_variations')")"
          if [ "$VARIANT_TABLE" != "product_variations" ]; then
            echo "migration 0038 did not create product_variations"
            exit 1
          fi

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            down 1

          VARIANT_TABLE="$(docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_upgrade -Atc "SELECT to_regclass('public.product_variations')")"
          if [ -n "$VARIANT_TABLE" ]; then
            echo "migration 0038 rollback left product_variations behind"
            exit 1
          fi

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_upgrade?sslmode=disable" \
            up 1

      - name: Verify product gallery tenant isolation at DB level
        run: |
          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo -v ON_ERROR_STOP=1 \
            < backend/tests/integration/product_images_isolation.sql

      - name: Verify return-policy v49 migration, constraints and rollback
        run: |
          set -euo pipefail
          docker compose exec -T db psql -U sistemaemgo -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS sistemaemgo_policy WITH (FORCE);" \
            -c "CREATE DATABASE sistemaemgo_policy OWNER sistemaemgo;"

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_policy?sslmode=disable" \
            goto 49

          # Fresh migration runs before the role seed. The admin role and
          # its complete grants are provisioned by the trusted installer.
          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_policy \
            -v ON_ERROR_STOP=1 -v ALLOW_DEMO_SEED=1 < backend/seed/seed.sql

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_policy -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM information_schema.columns
                           WHERE table_name='products' AND column_name='return_policy')
              OR NOT EXISTS (SELECT 1 FROM information_schema.columns
                             WHERE table_name='sale_items' AND column_name='return_policy_snapshot')
              OR NOT EXISTS (SELECT 1 FROM information_schema.columns
                             WHERE table_name='sale_returns' AND column_name='return_basis') THEN
              RAISE EXCEPTION 'migration 0049 missing policy/snapshot/basis columns';
            END IF;
            IF (SELECT count(*) FROM pg_constraint
                WHERE conname IN ('products_return_policy_check','sale_items_return_policy_snapshot_check','sale_returns_basis_check')) <> 3 THEN
              RAISE EXCEPTION 'migration 0049 missing policy constraints';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM roles r JOIN role_permissions rp ON rp.role_id=r.id
              JOIN permissions p ON p.id=rp.permission_id
              WHERE r.name='admin' AND p.code='sale:return:override'
            ) THEN
              RAISE EXCEPTION 'migration 0049 missing admin override permission';
            END IF;
            IF EXISTS (
              SELECT 1 FROM roles r JOIN role_permissions rp ON rp.role_id=r.id
              JOIN permissions p ON p.id=rp.permission_id
              WHERE r.name IN ('cashier','manager') AND p.code='sale:return:override'
            ) THEN
              RAISE EXCEPTION 'migration 0049 granted override to unauthorized roles';
            END IF;
          END $check$;
          SQL

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_policy?sslmode=disable" \
            down 1

          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_policy -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          BEGIN
            IF EXISTS (SELECT 1 FROM information_schema.columns
                       WHERE table_name='products' AND column_name='return_policy')
              OR EXISTS (SELECT 1 FROM information_schema.columns
                         WHERE table_name='sale_items' AND column_name='return_policy_snapshot')
              OR EXISTS (SELECT 1 FROM information_schema.columns
                         WHERE table_name='sale_returns' AND column_name='return_basis')
              OR EXISTS (SELECT 1 FROM permissions WHERE code='sale:return:override') THEN
              RAISE EXCEPTION 'rollback 0049 left policy data definitions behind';
            END IF;
          END $check$;
          SQL

          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_policy?sslmode=disable" \
            up 1
          docker compose exec -T db psql -U sistemaemgo -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS sistemaemgo_policy WITH (FORCE);"

      - name: Verify username login v50 migration and reversible schema
        run: |
          set -euo pipefail
          docker compose exec -T db psql -U sistemaemgo -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS sistemaemgo_username WITH (FORCE);" \
            -c "CREATE DATABASE sistemaemgo_username OWNER sistemaemgo;"
          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_username?sslmode=disable" \
            goto 50
          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_username \
            -v ON_ERROR_STOP=1 -v ALLOW_DEMO_SEED=1 < backend/seed/seed.sql
          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_username -v ON_ERROR_STOP=1 <<'SQL'
          DO $guard$
          DECLARE conflict_seen bool := false;
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM information_schema.columns
                           WHERE table_name='users' AND column_name='username')
              OR NOT EXISTS (SELECT 1 FROM information_schema.columns
                             WHERE table_name='staff_invitations' AND column_name='username')
              OR NOT EXISTS (SELECT 1 FROM information_schema.columns
                             WHERE table_name='users' AND column_name='email' AND is_nullable='YES')
              OR NOT EXISTS (SELECT 1 FROM information_schema.columns
                             WHERE table_name='staff_invitations' AND column_name='email' AND is_nullable='YES') THEN
              RAISE EXCEPTION 'migration 0050 missing optional-email/username schema';
            END IF;
            INSERT INTO users(username,email,name,password_hash,active)
            VALUES('caixa_global1',NULL,'E2E username',crypt('Senha-Individual-2026!',gen_salt('bf',10)),true);
            BEGIN
              INSERT INTO users(username,email,name,password_hash,active)
              VALUES('caixa_global1','other@example.test','Duplicate username',crypt('Senha-Individual-2026!',gen_salt('bf',10)),true);
            EXCEPTION WHEN unique_violation THEN
              conflict_seen := true;
            END;
            IF NOT conflict_seen THEN
              RAISE EXCEPTION 'migration 0050 allowed colliding global usernames';
            END IF;
          END $guard$;
          DELETE FROM users WHERE username='caixa_global1';
          SQL
          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_username?sslmode=disable" \
            down 1
          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_username -v ON_ERROR_STOP=1 <<'SQL'
          DO $guard$
          BEGIN
            IF EXISTS (SELECT 1 FROM information_schema.columns
                       WHERE table_name IN ('users','staff_invitations') AND column_name='username')
              OR EXISTS (SELECT 1 FROM information_schema.columns
                         WHERE table_name='users' AND column_name='email' AND is_nullable='YES') THEN
              RAISE EXCEPTION 'rollback 0050 left username schema behind';
            END IF;
          END $guard$;
          SQL
          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_username?sslmode=disable" \
            up 1
          docker compose exec -T db psql -U sistemaemgo -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS sistemaemgo_username WITH (FORCE);"

      - name: Verify password recovery v51 schema and safe rollback
        run: |
          set -euo pipefail
          docker compose exec -T db psql -U sistemaemgo -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS sistemaemgo_pwdreset WITH (FORCE);" \
            -c "CREATE DATABASE sistemaemgo_pwdreset OWNER sistemaemgo;"
          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_pwdreset?sslmode=disable" \
            goto 51
          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_pwdreset -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM information_schema.columns
                           WHERE table_name='users' AND column_name='auth_version')
              OR to_regclass('public.staff_password_resets') IS NULL
              OR NOT EXISTS (SELECT 1 FROM pg_indexes
                             WHERE indexname='staff_password_reset_one_pending_per_user') THEN
              RAISE EXCEPTION 'migration 0051 recovery schema incomplete';
            END IF;
          END $verify$;
          SQL
          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_pwdreset?sslmode=disable" \
            down 1
          docker compose exec -T db psql -U sistemaemgo -d sistemaemgo_pwdreset -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          BEGIN
            IF EXISTS (SELECT 1 FROM information_schema.columns
                       WHERE table_name='users' AND column_name='auth_version')
              OR to_regclass('public.staff_password_resets') IS NOT NULL THEN
              RAISE EXCEPTION 'rollback 0051 did not revert the recovery schema';
            END IF;
          END $verify$;
          SQL
          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:sistemaemgo@127.0.0.1:5433/sistemaemgo_pwdreset?sslmode=disable" \
            up 1
          docker compose exec -T db psql -U sistemaemgo -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS sistemaemgo_pwdreset WITH (FORCE);"

      - name: Run tagged integration tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://sistemaemgo:sistemaemgo@localhost:5433/sistemaemgo?sslmode=disable
          TEST_REDIS_ADDR: localhost:6379
        run: go test -tags=integration ./tests/integration/...
      - name: Verify supplier integration test can run twice in the same disposable DB
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://sistemaemgo:sistemaemgo@localhost:5433/sistemaemgo?sslmode=disable
        run: |
          set -euo pipefail
          go test -v -tags=integration -count=2 -p 1 -parallel 1 \
            -run '^TestProcurementRepo_TenantIsolation$' \
            ./tests/integration/... | tee /tmp/esterium-supplier-rerun.log
          passed="$(grep -Fc -- '--- PASS: TestProcurementRepo_TenantIsolation ' /tmp/esterium-supplier-rerun.log || true)"
          test "$passed" -eq 2
      - name: Exercise NFC-e reservation and isolation on a disposable database
        env:
          TEST_DATABASE_URL: postgres://sistemaemgo:sistemaemgo@localhost:5433/sistemaemgo_fiscal_disposable_ci?sslmode=disable
          TEST_FISCAL_DISPOSABLE_DB: "1"
        run: |
          set -euo pipefail
          # This database is created exclusively for this CI step.
          # Never alter or delete fiscal sequences in the normal test DB.
          if [ "$(docker compose exec -T db psql -U sistemaemgo -d postgres -Atc "SELECT count(*) FROM pg_database WHERE datname='sistemaemgo_fiscal_disposable_ci'")" != "0" ]; then
            echo "Refusing to reuse a pre-existing fiscal database"
            exit 1
          fi
          docker compose exec -T db psql -U sistemaemgo -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE sistemaemgo_fiscal_disposable_ci OWNER sistemaemgo;"
          trap 'docker compose exec -T db psql -U sistemaemgo -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE sistemaemgo_fiscal_disposable_ci;"' EXIT
          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="$TEST_DATABASE_URL" up
          docker compose run --rm -v "$PWD/backend/seed:/seed:ro" db \
            psql "postgres://sistemaemgo:sistemaemgo@db:5432/sistemaemgo_fiscal_disposable_ci?sslmode=disable" \
            -v ON_ERROR_STOP=1 -v ALLOW_DEMO_SEED=1 -f /seed/seed.sql
          (
            cd backend
            go test -v -tags=integration -count=1 -p 1 -parallel 1 \
              -run '^(TestNFCeFoundation_TenantIsolationAndConstraints|TestNFCeReservation_IsAtomicAndIdempotentPerSale)$' \
              ./tests/integration/... | tee /tmp/esterium-fiscal-sequence-tests.log
          )
          # Prevent a false green if either guarded test unexpectedly skips.
          grep -Fq -- '--- PASS: TestNFCeFoundation_TenantIsolationAndConstraints ' /tmp/esterium-fiscal-sequence-tests.log
          grep -Fq -- '--- PASS: TestNFCeReservation_IsAtomicAndIdempotentPerSale ' /tmp/esterium-fiscal-sequence-tests.log
      - name: Start API and verify readiness
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgres://sistemaemgo:sistemaemgo@localhost:5433/sistemaemgo?sslmode=disable
          REDIS_ADDR: localhost:6379
          JWT_SECRET: ci-integration-secret-that-is-over-32-chars
          HTTP_ADDR: :18080
          OTEL_ENABLED: "false"
        run: |
          go build -o /tmp/sistemaemgo-api ./cmd/api
          /tmp/sistemaemgo-api > /tmp/sistemaemgo-api.log 2>&1 &
          echo $! > /tmp/sistemaemgo-api.pid
          for i in {1..30}; do
            if curl --fail --silent http://localhost:18080/health/ready; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/sistemaemgo-api.log
          exit 1

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start database, Redis and migrations
        run: docker compose up -d db redis migrate
      - name: Seed browser test data
        run: |
          docker compose run --rm seed
          docker compose run --rm -v "$PWD/backend/seed:/seed:ro" db \
            psql "postgres://sistemaemgo:sistemaemgo@db:5432/sistemaemgo" \
            -v ON_ERROR_STOP=1 -f /seed/seed.e2e.sql
      - name: Start API and wait for readiness
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgres://sistemaemgo:sistemaemgo@localhost:5433/sistemaemgo?sslmode=disable
          REDIS_ADDR: localhost:6379
          JWT_SECRET: ci-e2e-secret-that-is-longer-than-32-characters
          HTTP_ADDR: :8080
          OTEL_ENABLED: "false"
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173
          RATE_LIMIT_LOGIN_PER_MINUTE: "1000"
          RATE_LIMIT_LOGIN_IDENTIFIER_PER_MINUTE: "1000"
          RATE_LIMIT_LOGIN_IP_IDENTIFIER_PER_MINUTE: "1000"
          RATE_LIMIT_REFRESH_PER_MINUTE: "1000"
          RATE_LIMIT_LOGOUT_PER_MINUTE: "1000"
          RATE_LIMIT_SALES_PER_MINUTE: "1000"
          RATE_LIMIT_FISCAL_PER_MINUTE: "1000"
        run: |
          go build -o /tmp/sistemaemgo-api ./cmd/api
          /tmp/sistemaemgo-api > /tmp/api.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health/ready; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/api.log
          exit 1
      - name: Install frontend and Playwright
        working-directory: web
        run: |
          npm install --global npm@11.6.1
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Start frontend
        working-directory: web
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8080
        run: npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/web.log 2>&1 &
      - name: Run browser E2E
        working-directory: web
        run: npx playwright test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Go vulnerability scan
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Frontend production dependency audit
        working-directory: web
        run: |
          npm install --global npm@11.6.1
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Generate remediated frontend lockfile
        working-directory: web
        run: |
          npm audit fix --package-lock-only || true
          npm audit --json > audit-after-fix.json || true
      - name: Upload remediated frontend lockfile
        uses: actions/upload-artifact@v7
        with:
          name: frontend-audit-fix
          path: |
            web/package.json
            web/package-lock.json
            web/audit-after-fix.json
          if-no-files-found: error


  e2e-prodlike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start verified-TLS PostgreSQL and Redis
        run: |
          mkdir -p /tmp/tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=SistemaEmGo CI CA" \
            -keyout /tmp/tls/ca.key \
            -out /tmp/tls/ca.crt

          openssl req -newkey rsa:2048 -nodes \
            -subj "/CN=127.0.0.1" \
            -keyout /tmp/tls/server.key \
            -out /tmp/tls/server.csr
          printf "subjectAltName=IP:127.0.0.1\nextendedKeyUsage=serverAuth\n" > /tmp/tls/server.ext
          openssl x509 -req -days 1 \
            -in /tmp/tls/server.csr \
            -CA /tmp/tls/ca.crt \
            -CAkey /tmp/tls/ca.key \
            -CAcreateserial \
            -extfile /tmp/tls/server.ext \
            -out /tmp/tls/server.crt

          chmod 600 /tmp/tls/server.key
          chmod 644 /tmp/tls/server.crt /tmp/tls/ca.crt
          sudo chown 999:999 /tmp/tls/server.key /tmp/tls/server.crt /tmp/tls/ca.crt
          sudo cp /tmp/tls/ca.crt /usr/local/share/ca-certificates/sistemaemgo-ci-ca.crt
          sudo update-ca-certificates

          docker rm -f pg-staging redis-staging caddy-staging >/dev/null 2>&1 || true

          docker run -d --name pg-staging \
            -e POSTGRES_DB=sistemaemgo \
            -e POSTGRES_USER=sistemaemgo \
            -e POSTGRES_PASSWORD=ci-staging-db-password \
            -p 127.0.0.1::5432 \
            -v /tmp/tls:/tls:ro \
            postgres:16 \
            -c ssl=on \
            -c ssl_cert_file=/tls/server.crt \
            -c ssl_key_file=/tls/server.key

          docker run -d --name redis-staging \
            -p 127.0.0.1::6379 \
            -v /tmp/tls:/tls:ro \
            redis:7.4-alpine \
            redis-server \
              --port 0 \
              --tls-port 6379 \
              --tls-cert-file /tls/server.crt \
              --tls-key-file /tls/server.key \
              --tls-ca-cert-file /tls/ca.crt \
              --tls-auth-clients no \
              --requirepass ci-staging-redis-password

          for i in {1..30}; do
            if docker exec pg-staging pg_isready -U sistemaemgo -d sistemaemgo >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec pg-staging pg_isready -U sistemaemgo -d sistemaemgo
          docker exec redis-staging redis-cli --tls --cacert /tls/ca.crt -a ci-staging-redis-password ping

          PG_STAGING_PORT="$(docker port pg-staging 5432/tcp | sed -E 's/.*:([0-9]+)$/\1/' | head -n1)"
          REDIS_STAGING_PORT="$(docker port redis-staging 6379/tcp | sed -E 's/.*:([0-9]+)$/\1/' | head -n1)"
          test -n "$PG_STAGING_PORT"
          test -n "$REDIS_STAGING_PORT"
          echo "PG_STAGING_PORT=$PG_STAGING_PORT" >> "$GITHUB_ENV"
          echo "REDIS_STAGING_PORT=$REDIS_STAGING_PORT" >> "$GITHUB_ENV"
      - name: Migrate and seed over PostgreSQL TLS
        run: |
          docker run --rm --network host \
            -v "$PWD/backend/migrations:/migrations:ro" \
            -v /tmp/tls:/tls:ro \
            migrate/migrate:v4.17.1 \
            -path=/migrations \
            -database="postgres://sistemaemgo:ci-staging-db-password@127.0.0.1:${PG_STAGING_PORT}/sistemaemgo?sslmode=verify-full&sslrootcert=/tls/ca.crt" \
            up

          docker run --rm --network host \
            -v "$PWD/backend/seed:/seed:ro" \
            -v /tmp/tls:/tls:ro \
            postgres:16 \
            psql "postgres://sistemaemgo:ci-staging-db-password@127.0.0.1:${PG_STAGING_PORT}/sistemaemgo?sslmode=verify-full&sslrootcert=/tls/ca.crt" \
            -v ON_ERROR_STOP=1 -v ALLOW_DEMO_SEED=1 -f /seed/seed.sql
      - name: Configure staging hostname
        run: echo "127.0.0.1 staging.example.test" | sudo tee -a /etc/hosts

      - name: Start staging-configured API
        working-directory: backend
        env:
          APP_ENV: staging
          FISCAL_PROVIDER: disabled
          ESTERIUM_MIGRATIONS_DIR: migrations
          JWT_SECRET: ci-staging-jwt-secret-longer-than-32-characters
          HTTP_ADDR: :18081
          OTEL_ENABLED: "false"
          CORS_ALLOWED_ORIGINS: https://staging.example.test:8443
          TRUSTED_PROXY_CIDRS: 127.0.0.1/32
          METRICS_BEARER_TOKEN: ci-staging-metrics-token
          RATE_LIMIT_LOGIN_PER_MINUTE: "1000"
          RATE_LIMIT_LOGIN_IDENTIFIER_PER_MINUTE: "1000"
          RATE_LIMIT_LOGIN_IP_IDENTIFIER_PER_MINUTE: "1000"
          RATE_LIMIT_REFRESH_PER_MINUTE: "1000"
          RATE_LIMIT_LOGOUT_PER_MINUTE: "1000"
          RATE_LIMIT_SALES_PER_MINUTE: "1000"
          RATE_LIMIT_FISCAL_PER_MINUTE: "1000"
        run: |
          export DATABASE_URL="postgres://sistemaemgo:ci-staging-db-password@127.0.0.1:${PG_STAGING_PORT}/sistemaemgo?sslmode=verify-full&sslrootcert=/tmp/tls/ca.crt"
          export REDIS_URL="rediss://:ci-staging-redis-password@127.0.0.1:${REDIS_STAGING_PORT}/0"
          go build -o /tmp/sistemaemgo-staging-api ./cmd/api
          /tmp/sistemaemgo-staging-api --check-dependencies > /tmp/staging-dependency-preflight.log 2>&1 || {
            cat /tmp/staging-dependency-preflight.log
            exit 1
          }
          grep -Fq 'PostgreSQL schema and Redis atomic security checks passed' /tmp/staging-dependency-preflight.log
          /tmp/sistemaemgo-staging-api > /tmp/staging-api.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18081/health/ready; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/staging-api.log
          exit 1
      - name: Build frontend and start HTTPS reverse proxy
        working-directory: web
        env:
          VITE_API_BASE_URL: https://staging.example.test:8443
        run: |
          npm install --global npm@11.6.1
          npm ci
          npm run build
          npx playwright install --with-deps chromium

          cat > /tmp/Caddyfile <<'EOF'
          https://staging.example.test:8443 {
            tls internal
            @backend path /api/* /health /health/* /metrics
            handle @backend {
              reverse_proxy 127.0.0.1:18081
            }
            handle {
              root * /srv
              try_files {path} /index.html
              file_server
            }
          }
          EOF

          docker run -d --name caddy-staging --network host \
            -v /tmp/Caddyfile:/etc/caddy/Caddyfile:ro \
            -v "$PWD/dist:/srv:ro" \
            caddy:2.8-alpine

          for i in {1..30}; do
            health="$(curl --noproxy '*' -k --fail --silent https://staging.example.test:8443/health/ready || true)"
            app="$(curl --noproxy '*' -k --fail --silent https://staging.example.test:8443/login || true)"
            if echo "$health" | grep -q '"status":"ready"' && echo "$app" | grep -q 'id="root"'; then
              exit 0
            fi
            sleep 2
          done
          docker logs caddy-staging
          exit 1
      - name: Run staging-like browser E2E
        working-directory: web
        env:
          E2E_PRODLIKE: "1"
          E2E_BASE_URL: https://staging.example.test:8443
          E2E_IGNORE_HTTPS_ERRORS: "1"
        run: npx playwright test e2e/prodlike.spec.ts --project=chromium
